[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-intelligence-agent"
version = "0.1.0"
description = "Evidence-backed job intelligence with local-first inference"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "langgraph>=1,<2", "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "pgvector>=0.3,<1", "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
